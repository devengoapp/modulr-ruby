---
name: release

"on":
  push:
    tags:
      - v*.*.*

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://rubygems.org/gems/modulr-api
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Ruby
        # yamllint disable-line rule:line-length
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94  # v1.336.0
        with:
          bundler-cache: true
      - name: Release Gem
        # yamllint disable-line rule:line-length
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b  # v1.4.1
