---
name: release

"on":
  push:
    tags:
      - v*.*.*

permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  changelog:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check CHANGELOG.md has this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qF "## [$version] - " CHANGELOG.md || {
            echo "::error file=CHANGELOG.md::No section for $version"
            exit 1
          }

  publish:
    needs: [ci, changelog]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://rubygems.org/gems/modulr-api
    permissions:
      contents: read
      id-token: write
    env:
      # Keeps the bundle's json 3 away from the sigstore signer, which breaks
      # under it (segiddins/protobug#333).
      BUNDLE_PATH: vendor/bundle
    steps:
      - name: Checkout Code
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Ruby
        # yamllint disable-line rule:line-length
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94  # v1.336.0
      # No bundler cache: a poisoned cache would end up in the published gem.
      - name: Install dependencies
        run: bundle install
      - name: Release Gem
        # yamllint disable-line rule:line-length
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b  # v1.4.1
